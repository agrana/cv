# Site settings
title: "Alfonso Grana - Resume"
description: "Professional resume of Alfonso Grana"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Alfonso Grana"
resume_title:                   "Senior Site Reliability Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "alfonso.grana@example.com"

# the next two items are used for schema itemprops in _layouts/resume.html
resume_contact_telephone:       ""
resume_contact_address:         ""

resume_header_contact_info:     ""
display_header_contact_info:    "false"

resume_header_intro: "<p>Senior Site Reliability Engineer with 20+ years of experience in infrastructure, cloud technologies, and DevOps practices. Expert in AWS & Azure, infrastructure automation, CI/CD pipelines, and building reliable, scalable systems. Passionate about bridging development and operations teams while implementing best practices for observability and reliability.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
# to leave blank
resume_looking_for_work:        "yes"

# Decide which sections to use
# comment out to hide
resume_section_experience:      true
resume_section_education:       true
# resume_section_projects:        true
resume_section_skills:          true
resume_section_recognition:     true
# resume_section_links:           true
resume_section_associations:    true
# resume_section_interests:       true

# Resume social links
# uncomment the options you wish to display, and add your own URL
resume_social_links:
  resume_github_url:            "https://github.com/agrana"
  # resume_twitter_url:           ""
  # resume_dribbble_url:          ""
  # resume_facebook_url:          ""
  resume_linkedin_url:          ""
  # resume_instagram_url:         ""
  resume_website_url:           ""
  # resume_medium_url:            ""
resume_print_social_links:      true

# Design settings
resume_theme:                   default

