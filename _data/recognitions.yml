# Certifications

- award: AWS Certified Solutions Architect – Professional
  organization: Amazon Web Services
  year: Apr 2024 – Apr 2027
  summary: Earners of this certification have an extensive understanding of designing technical strategies to accomplish specific business goals. They demonstrated the ability to balance best practices and trade-offs based on business context. Badge owners are able to design solutions across multiple platforms and providers.

- award: AWS Certified DevOps Engineer – Professional
  organization: Amazon Web Services
  year: Apr 2022 – Apr 2025
  summary: Professional-level certification demonstrating expertise in AWS DevOps practices, CI/CD, infrastructure automation, and cloud architecture.

- award: Azure Developer Associate
  organization: Microsoft
  year: 2021 – 2023
  summary: Microsoft Azure certification covering cloud development, DevOps practices, and Azure services integration.

- award: MLOps Specialization
  organization: Coursera
  year: 2022
  summary: Complete MLOps specialization including ML in Production, Data Lifecycle, Modeling Pipelines, and Model Deployment.

- award: KCNA - Kubernetes and Cloud Native Associate
  organization: The Linux Foundation
  year: 2023 - 2026
  summary: Earners of this designation demonstrated a basic knowledge of Kubernetes and cloud-native technologies, including how to deploy an application using basic kubectl commands, the architecture of Kubernetes (containers, pods, nodes, clusters), understanding the cloud-native landscape and projects (storage, networking, GitOps, service mesh), and understanding the principles of cloud-native security.

- award: GitOps Fundamentals
  organization: Codefresh
  year: 2024 – 2027
  summary: This badge recognizes individuals who have demonstrated proficiency in GitOps principles and practices with Argo CD and Argo Rollouts. This certification certifies the earner’s ability to set up and manage Argo CD and progressive delivery using Argo Rollouts using GitOps principles and practices. Earners of this badge possess skills and have a grasp of applications, rollouts, and operation of Argo CD in a day-to-day end-user way while following the GitOps principles.

- award: CCNA – Cisco
  organization: Cisco Systems
  year: 2006 – 2009
  summary: Cisco Certified Network Associate certification covering networking fundamentals, routing, switching, and network security.
